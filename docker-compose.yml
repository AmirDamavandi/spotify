
services:
  spotify:
    build: .
    command:
      - gunicorn spotify.wsgi -b 0.0.0.0:8000
    container_name: spotify
    expose:
      - 8000
    volumes:
      - ./:spotify_project/
    networks:
      - main
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: spotify-nginx
    depends_on:
      - spotify
    command:
      - nginx -f daemon off
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - main
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  main:
